# Look for Windows and other systems, so a dual-boot machine can still reach them.
GRUB_DISABLE_OS_PROBER=false

# The Jungey boot menu (hooks/35-boot-menu.sh), at the screen's own resolution.
GRUB_THEME=/boot/grub/themes/jungey/theme.txt
GRUB_GFXMODE=1920x1080,1600x900,1366x768,1280x800,1280x720,1024x768,auto
