# Jungey OS build settings. Sourced by build.sh; every value can be overridden
# from the environment, e.g.  OS_VERSION=1.1 sudo -E ./os/build.sh

OS_NAME="${OS_NAME:-Jungey OS}"
OS_ID="${OS_ID:-jungey}"
OS_VERSION="${OS_VERSION:-1.0}"

# Ubuntu LTS release the system is built on, and where its packages come from.
SUITE="${SUITE:-noble}"
SUITE_VERSION="${SUITE_VERSION:-24.04}"
MIRROR="${MIRROR:-http://archive.ubuntu.com/ubuntu}"
SECURITY_MIRROR="${SECURITY_MIRROR:-http://security.ubuntu.com/ubuntu}"
ARCH="amd64"

# The account the live session logs in as. It has no password.
LIVE_USER="${LIVE_USER:-jungey}"
HOSTNAME_LIVE="${HOSTNAME_LIVE:-jungey-os}"

# ISO volume label: at most 32 characters, no spaces.
ISO_LABEL="${ISO_LABEL:-JUNGEY_OS_${OS_VERSION//./_}}"

# xz packs about 15% tighter than zstd, which keeps the ISO under GitHub's 2 GB
# release-asset limit; zstd builds several times faster for local iteration.
SQUASHFS_COMP="${SQUASHFS_COMP:-xz}"
