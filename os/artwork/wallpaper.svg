<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <!-- Jungey OS default wallpaper: the arc reactor from Jungey's icon, faint and
       off to the right so desktop icons on the left stay readable. -->
  <defs>
    <radialGradient id="bg" cx="1720" cy="720" r="1900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12304a"/>
      <stop offset="0.4" stop-color="#0a1825"/>
      <stop offset="1" stop-color="#03060a"/>
    </radialGradient>
    <radialGradient id="glow" cx="1720" cy="720" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9eeaff" stop-opacity="0.60"/>
      <stop offset="0.22" stop-color="#3cc8f2" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#3cc8f2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="2560" height="1440" fill="url(#bg)"/>
  <g fill="none" transform="translate(1720 720)">
    <circle r="640" stroke="#5ad7ff" stroke-opacity="0.05" stroke-width="2"/>
    <circle r="560" stroke="#5ad7ff" stroke-opacity="0.12" stroke-width="3" stroke-dasharray="3 22"/>
    <circle r="480" stroke="#5ad7ff" stroke-opacity="0.08" stroke-width="2"/>
    <circle r="410" stroke="#1f6f8b" stroke-opacity="0.55" stroke-width="18"/>
    <!-- ten segments: circumference 2*pi*300 = 1885, so 188.5 per segment -->
    <circle r="300" stroke="#5ad7ff" stroke-opacity="0.30" stroke-width="72"
            stroke-dasharray="152.5 36" transform="rotate(-81)"/>
    <circle r="200" stroke="#9eeaff" stroke-opacity="0.40" stroke-width="10"/>
    <circle r="130" fill="#bff3ff" fill-opacity="0.16"/>
  </g>
  <circle cx="1720" cy="720" r="460" fill="url(#glow)"/>
</svg>
