    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c4666"/>
      <stop offset="1" stop-color="#08121d"/>
    </linearGradient>
    <linearGradient id="j" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bff3ff"/>
      <stop offset="1" stop-color="#27b4ea"/>
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="58" fill="url(#bg)"/>
  <rect x="14" y="14" width="228" height="228" rx="56" fill="none" stroke="#5ad7ff" stroke-opacity="0.45" stroke-width="4"/>
  <path d="M146 62 V146 a44 44 0 0 1 -88 0" fill="none" stroke="url(#j)" stroke-width="32" stroke-linecap="round"/>
  <path d="M196 44 L204 68 L228 76 L204 84 L196 108 L188 84 L164 76 L188 68 Z" fill="#ffffff"/>
