<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- The Jungey assistant's icon: a "J" with an AI spark. The arc reactor
       (reactor.svg) is the operating system's mark, so the two stay distinct. -->
