<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <!-- Jungey OS login and lock screen: the wallpaper's reactor, with the name under
       it. The login box sits left of centre, clear of both. -->
  <defs>
    <radialGradient id="bg" cx="1780" cy="760" r="2000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d2233"/>
      <stop offset="0.45" stop-color="#07121c"/>
      <stop offset="1" stop-color="#020407"/>
    </radialGradient>
    <radialGradient id="glow" cx="1780" cy="760" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9eeaff" stop-opacity="0.65"/>
      <stop offset="0.25" stop-color="#3cc8f2" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3cc8f2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fade" cx="1780" cy="760" r="1500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#5ad7ff" stroke-opacity="0.07" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.6" fill="#5ad7ff" fill-opacity="0.18"/>
    </pattern>
    <mask id="gridmask"><rect width="2560" height="1440" fill="url(#fade)"/></mask>
  </defs>

  <rect width="2560" height="1440" fill="url(#bg)"/>
  <rect width="2560" height="1440" fill="url(#grid)" mask="url(#gridmask)"/>

  <!-- circuit traces running into the reactor -->
  <g fill="none" stroke="#5ad7ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.28">
    <path d="M1280 320 H1536 L1600 384 H1700"/>
    <path d="M1216 1152 H1472 L1600 1024 H1664"/>
    <path d="M2496 448 H2176 L2112 512 H2000"/>
    <path d="M2496 1088 H2240 L2112 960 H2016"/>
    <path d="M1152 704 H1344"/>
    <path d="M1780 128 V256 L1728 308"/>
  </g>
  <g fill="#5ad7ff" fill-opacity="0.55">
    <circle cx="1280" cy="320" r="5"/><circle cx="1216" cy="1152" r="5"/>
    <circle cx="2496" cy="448" r="5"/><circle cx="2496" cy="1088" r="5"/>
    <circle cx="1152" cy="704" r="5"/><circle cx="1780" cy="128" r="5"/>
    
  </g>

  <!-- the reactor -->
  <g fill="none" transform="translate(1780 760)">
    <circle r="560" stroke="#5ad7ff" stroke-opacity="0.10" stroke-width="3" stroke-dasharray="3 22"/>
    <circle r="470" stroke="#5ad7ff" stroke-opacity="0.07" stroke-width="2"/>
    <circle r="400" stroke="#1f6f8b" stroke-opacity="0.60" stroke-width="16"/>
    <!-- ten segments: circumference 2*pi*300 = 1885, so 188.5 per segment -->
    <circle r="300" stroke="#5ad7ff" stroke-opacity="0.32" stroke-width="72"
            stroke-dasharray="152.5 36" transform="rotate(-81)"/>
    <circle r="200" stroke="#9eeaff" stroke-opacity="0.45" stroke-width="10"/>
    <circle r="130" fill="#bff3ff" fill-opacity="0.16"/>
  </g>
  <circle cx="1780" cy="760" r="420" fill="url(#glow)"/>

  <!-- the name under the reactor -->
  <g text-anchor="middle" fill="#d8f6ff">
    <text x="1780" y="1300" font-family="Inter, DejaVu Sans, sans-serif" font-size="64"
          font-weight="700" letter-spacing="22">JUNGEY OS</text>
    <text x="1780" y="1352" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="22"
          fill="#5ad7ff" fill-opacity="0.6" letter-spacing="3">just a unified neural gateway engineered for you</text>
  </g>
</svg>
