---
efiSystemPartition: "/boot/efi"
enableLuksAutomatedPartitioning: true
luksGeneration: luks2
userSwapChoices:
    - none
    - file
initialSwapChoice: file
drawNestedPartitions: true
defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4"]
# GRUB cannot read a LUKS2 root, so an encrypted install gets a small plain /boot.
partitionLayout:
    - name: "jungey_boot"
      filesystem: ext4
      noEncrypt: true
      onlyPresentWithEncryption: true
      mountPoint: "/boot"
      size: 2G
    - name: "jungey_root"
      filesystem: unknown
      mountPoint: "/"
      size: 100%
