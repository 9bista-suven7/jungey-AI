---
showSupportUrl:         true
showKnownIssuesUrl:     false
showReleaseNotesUrl:    false
requirements:
    requiredStorage:    10
    requiredRam:        1.0
    internetCheckUrl:   http://connectivity-check.ubuntu.com
    check:
        - storage
        - ram
        - power
        - internet
        - root
    required:
        - storage
        - ram
        - root
geoip:
    style:  "none"
    url:    "https://geoip.ubuntu.com/lookup"
    selector: "CountryCode"
