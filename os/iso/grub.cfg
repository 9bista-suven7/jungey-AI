# Boot menu of the Jungey OS USB stick / DVD. build.sh fills in the @...@ values.

search --no-floppy --set=root --fs-uuid @ISO_UUID@
set default=0
set timeout=10
set timeout_style=menu

if loadfont unicode; then
    set gfxmode=auto
    insmod all_video
    insmod gfxterm
    terminal_output gfxterm
fi
set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-cyan

menuentry "Try or install @OS_NAME@" {
    set gfxpayload=keep
    linux   /casper/vmlinuz boot=casper quiet splash ---
    initrd  /casper/initrd
}

menuentry "Try or install @OS_NAME@ (safe graphics)" {
    set gfxpayload=keep
    linux   /casper/vmlinuz boot=casper nomodeset quiet splash ---
    initrd  /casper/initrd
}

menuentry "Try @OS_NAME@ from RAM (the USB stick can be removed)" {
    set gfxpayload=keep
    linux   /casper/vmlinuz boot=casper toram quiet splash ---
    initrd  /casper/initrd
}

if [ "$grub_platform" = "efi" ]; then
    menuentry "UEFI firmware settings" {
        fwsetup
    }
fi

menuentry "Boot from the next device" {
    exit 1
}
