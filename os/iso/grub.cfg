# Boot menu of the Jungey OS USB stick / DVD. build.sh fills in the @...@ values.

search --no-floppy --set=root --fs-uuid @ISO_UUID@
set default=0
set timeout=10
set timeout_style=menu

set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-cyan
if loadfont unicode; then
    set gfxmode=auto
    insmod all_video
    insmod gfxterm
    terminal_output gfxterm
    # The Jungey boot menu; without it the plain menu above still works.
    insmod png
    insmod gfxmenu
    set jungey=($root)/boot/grub/themes/jungey
    if [ -f $jungey/theme.txt ]; then
        loadfont $jungey/inter-16.pf2
        loadfont $jungey/inter-20.pf2
        loadfont $jungey/inter-24.pf2
        set theme=$jungey/theme.txt
    fi
fi

menuentry "Try or install @OS_NAME@" --class jungey {
    set gfxpayload=keep
    linux   /casper/vmlinuz boot=casper quiet splash ---
    initrd  /casper/initrd
}

menuentry "Try or install @OS_NAME@ (safe graphics)" --class jungey {
    set gfxpayload=keep
    linux   /casper/vmlinuz boot=casper nomodeset quiet splash ---
    initrd  /casper/initrd
}

menuentry "Try @OS_NAME@ from RAM (the USB stick can be removed)" --class jungey {
    set gfxpayload=keep
    linux   /casper/vmlinuz boot=casper toram quiet splash ---
    initrd  /casper/initrd
}

if [ "$grub_platform" = "efi" ]; then
    menuentry "UEFI firmware settings" --class efi {
        fwsetup
    }
fi

menuentry "Boot from the next device" --class os {
    exit 1
}
