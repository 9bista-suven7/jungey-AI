<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Jungey Notepad: a page with its corner turned and lines being written, in Jungey's cyan. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1422"/>
      <stop offset="1" stop-color="#04070d"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="51.5" fill="none" stroke="#38e8ff" stroke-opacity="0.35"/>
  <g filter="url(#glow)" fill="none" stroke="#38e8ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M68 48 H152 L190 86 V196 A12 12 0 0 1 178 208 H80 A12 12 0 0 1 68 196 Z"/>
    <path d="M150 50 V88 H188"/>
    <path d="M96 128 H162"/>
    <path d="M96 158 H162"/>
    <path d="M96 188 H132"/>
  </g>
</svg>
